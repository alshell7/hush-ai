[package]
name = "hush-ai"
description = "Hush AI: real-time noise cancellation for every app, on your own computer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "hush-ai"

[lib]
name = "hush_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hush-ai"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hush-core = { path = "../../crates/hush-core" }
# macos-private-api: the transparent widget window on macOS (no effect elsewhere).
# protocol-asset: Studio plays its WAV files from the app's cache folder.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
eyre = "0.6"
rtrb = "0.3"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
log = "0.4"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "caf", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
rrule = "0.14"
# Live Translate: Gemini Live over a WebSocket.
tungstenite = { version = "0.27", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.54"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# The notch window: above the menu bar, and the screen's camera notch.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSScreen", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[dev-dependencies]
cpu-time = "1"
memory-stats = "1"
