version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    groups: { cargo: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: monthly }
    groups: { app: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: monthly }
    groups: { site: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
