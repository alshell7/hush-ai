name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "site/**", "docs/**", "assets/**"]
  pull_request:
    paths-ignore: ["**.md", "site/**", "docs/**", "assets/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  HUSH_MODEL: ${{ github.workspace }}/models/model.safetensors
  RAYON_NUM_THREADS: 2

jobs:
  engine:
    name: Engine · ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, runner: ubuntu-24.04 }
          # The regression gates are validated on macOS 26: Accelerate's results differ
          # slightly between macOS releases (see docs/ACCURACY.md).
          - { name: macOS ARM64, runner: macos-26 }
          - { name: Windows x64, runner: windows-2025 }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine
          cache-on-failure: true
      - name: Voice model (cached)
        id: model
        uses: actions/cache@v4
        with:
          path: models/model.safetensors
          key: model-6eac4e8cc721f99a
      - name: Download the voice model
        if: steps.model.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p models
          curl -fL --retry 3 -o "$HUSH_MODEL" https://huggingface.co/nvidia/Real-time_RE-USE/resolve/4c0c186272ca853cd18d832fc5c28777b62f32d1/model.safetensors
      - name: Check the model hash
        shell: bash
        run: |
          echo "6eac4e8cc721f99a22cde7eac3c9f8e2826ced5dc8a4234fd1977de1ec0d3ade  $HUSH_MODEL" > model.sha256
          if command -v sha256sum >/dev/null; then sha256sum -c model.sha256; else shasum -a 256 -c model.sha256; fi
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy -p hush-core --locked --all-targets --release -- -D warnings
      - name: Test (NVIDIA regression cases included)
        run: cargo test -p hush-core --locked --release -- --test-threads=1

  app:
    name: App · ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, runner: ubuntu-22.04 }
          - { name: macOS ARM64, runner: macos-15 }
          - { name: Windows x64, runner: windows-2025 }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: app
          cache-on-failure: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - name: macOS driver
        if: runner.os == 'macOS'
        run: sh virtual_mic/macos/build.sh target
      - name: Frontend
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Lint
        run: cargo clippy -p hush-ai --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test -p hush-ai --locked

  virtual-mic:
    name: Virtual microphone · ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, runner: ubuntu-24.04 }
          - { name: macOS, runner: macos-15 }
          - { name: Windows, runner: windows-2025 }
    steps:
      - uses: actions/checkout@v5
      - name: Shared reader tests (clang)
        if: runner.os != 'Windows'
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -o test_ring virtual_mic/test_ring.c -lm
          ./test_ring
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Shared reader tests (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /W4 /WX /O2 virtual_mic\test_ring.c /Fe:test_ring.exe
          test_ring.exe
      - name: Core Audio plug-in
        if: runner.os == 'macOS'
        run: |
          sh virtual_mic/macos/build.sh target
          clang -framework CoreAudio -framework CoreFoundation -o target/test_plugin virtual_mic/macos/test_plugin.c
          target/test_plugin target/HushMic.driver/Contents/MacOS/HushMic
